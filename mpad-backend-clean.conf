# --- API (PHP Laravel via FPM) ---

# api.mpad.online
server {
    server_name api.mpad.online apimpad.baubaukota.go.id;
    
    root /home/sipanda/retribusi-api/public;
    client_max_body_size 64M;
    index index.php;
    charset utf-8;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    
    error_page 404 /index.php;
    
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mpad.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mpad.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# api.sipanda.online (same codebase as api.mpad.online)


# afbarber (existing service on port 8081)
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.afbarber\.com$;
    
    root /var/www/html;
    index index.php;
    
    location /afbarber {
        alias /home/sipanda/afbarbershop/public;
        index index.php;
        try_files $uri $uri/ @afbarber;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }
    
    location @afbarber {
        rewrite /afbarber/(.*)$ /afbarber/index.php?/$1 last;
    }
}
