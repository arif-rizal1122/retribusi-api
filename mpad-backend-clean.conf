# M-PAD Backend - Port 8081 (behind Coolify/Traefik)
# Traefik handles SSL termination at 80/443
# This config serves at 8081 only

# Default catch-all
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    root /var/www/html;
    index index.html index.htm index.php;
    server_name _;
    
    location / {
        try_files $uri $uri/ =404;
    }
}

# --- STATIC FRONTENDS ---

# mpad.online / www.mpad.online / mpad.baubaukota.go.id
server {
    server_name mpad.online www.mpad.online mpad.baubaukota.go.id;
    
    root /home/sipanda/retribusi-mobile/dist;
    index index.html index.php;
    
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mpad.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mpad.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

