openapi: 3.0.3
info:
  title: 'M-PAD API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://api.sipanda.online'
tags:
  -
    name: Endpoints
    description: ''
paths:
  /api/opd/register:
    post:
      summary: 'Public OPD registration endpoint'
      operationId: publicOPDRegistrationEndpoint
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                opd_name:
                  type: string
                  description: 'OPD Data. Must not be greater than 255 characters.'
                  example: b
                opd_code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                opd_address:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                opd_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: ngzmiyvdljnikhwa
                  nullable: true
                admin_name:
                  type: string
                  description: 'Admin User Data (will also be used as OPD email). Must not be greater than 255 characters.'
                  example: 'y'
                admin_email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gilbert32@example.com
                admin_password:
                  type: string
                  description: ''
                  example: architecto
                admin_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: ngzmiyvdljnikhwa
                  nullable: true
                logo:
                  type: string
                  format: binary
                  description: 'Must be a file. Must be an image. Must not be greater than 2048 kilobytes.'
                  nullable: true
              required:
                - opd_name
                - opd_code
                - admin_name
                - admin_email
                - admin_password
      security: []
  /api/login:
    post:
      summary: 'Login user and create token'
      operationId: loginUserAndCreateToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - email
                - password
      security: []
  /api/citizen/login:
    post:
      summary: 'Login citizen (taxpayer) using NIK and Password'
      operationId: loginCitizentaxpayerUsingNIKAndPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nik:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - nik
                - password
      security: []
  /api/citizen/register:
    post:
      summary: 'Register a new citizen (taxpayer)'
      operationId: registerANewCitizentaxpayer
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nik:
                  type: string
                  description: 'Must be 16 characters.'
                  example: bngzmiyvdljnikhw
                name:
                  type: string
                  description: ''
                  example: architecto
                opd_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the opds table.'
                  example: null
                  nullable: true
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: ']|{+-0pBNvYg'
                address:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                phone:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - nik
                - name
                - password
      security: []
  /api/opds:
    get:
      summary: 'List all OPDs (super_admin only)'
      operationId: listAllOPDssuperAdminOnly
