  /api/pbb/calculate:
    post:
      summary: 'Calculate PBB based on kelas bumi & bangunan.'
      operationId: calculatePBBBasedOnKelasBumiBangunan
      description: "POST /api/pbb/calculate\n\nPrimary flow (user pilih kelas):\n  { \"luas_bumi\": 200, \"kelas_bumi\": \"045\",\n    \"luas_bangunan\": 100, \"kelas_bangunan\": \"015\",\n    \"njoptkp\": 10000000, \"tariff\": 0.001 }\n\nAuto flow (user input nilai per m²):\n  { \"luas_bumi\": 200, \"nilai_bumi_per_m2\": 5500000,\n    \"luas_bangunan\": 100, \"nilai_bangunan_per_m2\": 3500000,\n    \"njoptkp\": 10000000, \"tariff\": 0.001 }"
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                luas_bumi:
                  type: number
                  description: 'Must be at least 0.'
                  example: 27
                luas_bangunan:
                  type: number
                  description: 'Must be at least 0.'
                  example: 39
                njoptkp:
                  type: number
                  description: 'Must be at least 0.'
                  example: 84
                  nullable: true
                tariff:
                  type: number
                  description: 'Must be at least 0.'
                  example: 12
