name: Deploy Staging Environment

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          cd /home/sipanda/retribusi-api-staging
          echo "--- Comprehensive Diagnostics ---"
          pwd
          whereis git
          which git
          echo "PATH: $PATH"
          ls -la .env
          grep -E "DB_|APP_URL" .env | sed 's/PW=.*/PW=******/' | sed 's/PASSWORD=.*/PASSWORD=******/'
          echo "-------------------------------"
          
          # Force git path if missing from session
          GIT_CMD=$(which git || echo "/usr/bin/git")
          
          $GIT_CMD checkout staging || echo "Checkout failed, continuing..."
          $GIT_CMD fetch origin staging
          $GIT_CMD reset --hard origin/staging
          
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          sed -i 's/APP_DEBUG=false/APP_DEBUG=true/' .env
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
          sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || true
          
          echo "✅ Deploy completed successfully!"
