name: Deploy Staging Environment

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          cd /home/sipanda/retribusi-api-staging
          echo "--- Comprehensive Diagnostics ---"
          pwd
          whereis git
          which git
          echo "PATH: $PATH"
          ls -la .env
          grep -E "DB_|APP_URL" .env | sed 's/PW=.*/PW=******/' | sed 's/PASSWORD=.*/PASSWORD=******/'
          echo "-------------------------------"
          
          # Force git path if missing from session
          GIT_CMD=$(which git || echo "/usr/bin/git")
          
          $GIT_CMD checkout staging || echo "Checkout failed, continuing..."
          # Apply correct staging env values and fix Host mapping (127.0.0.1 -> localhost)
          sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=retribusi_staging/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=sipanda/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=Bapenda123#$/' .env
          
          # Map Legacy connection (required for SimpadKoneksiService / bills)
          sed -i 's/DB_HOST_LEGACY=.*/DB_HOST_LEGACY=localhost/' .env
          sed -i 's/DB_DATABASE_LEGACY=.*/DB_DATABASE_LEGACY=sw_patda/' .env
          sed -i 's/DB_USERNAME_LEGACY=.*/DB_USERNAME_LEGACY=sipanda/' .env
          sed -i 's/DB_PASSWORD_LEGACY=.*/DB_PASSWORD_LEGACY=Bapenda123#$/' .env
          
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
          
          echo "--- Database Connectivity Check ---"
          mysqladmin -u sipanda -pBapenda123#$ ping || echo "MySQL Ping FAILED"
          echo "----------------------------------"
          
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          echo "--- Laravel Error Logs (Last 50 Lines) ---"
          [ -f storage/logs/laravel.log ] && tail -n 50 storage/logs/laravel.log || echo "Logs not found or empty"
          echo "-----------------------------------------"
          
          sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
          sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || true
          
          echo "--- Final Verification ---"
          bash testing/vps_infra_audit.sh > vps_infra_audit.log; cat vps_infra_audit.log
          echo "--------------------------"
          
          echo "✅ Deploy completed successfully!"
