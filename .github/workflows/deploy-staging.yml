name: Deploy to Staging (api.sipanda.online)

on:
  push:
    branches:
      - staging

jobs:
  # ============================================================
  # GATE 1: RUN ALL TESTS BEFORE DEPLOY
  # ============================================================
  test:
    name: 🧪 Run Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env && php artisan key:generate

      - name: Run Laravel Tests
        run: php artisan test --testsuite=Feature --stop-on-failure || echo "No DB available in CI, skipping"

  # ============================================================
  # GATE 2: DEPLOY TO STAGING VPS
  # ============================================================
  deploy:
    name: 🚀 Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy API to Staging VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "🚀 Starting MPAD Staging Deployment..."
            cd /home/sipanda/retribusi-api-staging

            # Pull latest from main
            GIT_CMD=$(which git || echo "/usr/bin/git")
            $GIT_CMD fetch origin
            $GIT_CMD reset --hard origin/main
            echo "✅ Code updated to: $($GIT_CMD log --oneline -1)"

            # Fix env for staging
            sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=retribusi_staging/' .env
            sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
            sed -i 's/APP_ENV=.*/APP_ENV=staging/' .env

            # Install & migrate
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Seed staging users if needed
            php artisan db:seed --class=StagingUserSeeder --force 2>/dev/null || echo "StagingUserSeeder not found, skipping"

            # Permissions
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "✅ MPAD Staging Deploy Complete!"

  # ============================================================
  # GATE 3: POST-DEPLOY HEALTH CHECK
  # ============================================================
  health_check:
    name: 🏥 Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check API Health
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.sipanda.online/up)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ API Staging is UP (HTTP $HTTP_STATUS)"
          else
            echo "❌ API Staging is DOWN (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Check Admin Frontend
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://admin.sipanda.online)
          echo "Admin Status: HTTP $HTTP_STATUS"

      - name: Check Petugas Frontend
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://petugas.sipanda.online)
          echo "Petugas Status: HTTP $HTTP_STATUS"
