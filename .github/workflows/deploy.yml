name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/sipanda/retribusi-api

            # Pull latest code
            git pull origin main
            # RECOVERY: CLEAN STATE
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # RECOVERY: DEPENDENCIES
            composer install --no-dev --optimize-autoloader || echo "Composer failed - might be permissions"
            php artisan migrate --force
            php artisan config:clear
            
            # RECOVERY: LOG DUMP (for remote reading)
            [ -f storage/logs/laravel.log ] && tail -n 100 storage/logs/laravel.log > public/api_error.txt || echo "No logs" > public/api_error.txt
            chmod 644 public/api_error.txt

            # EMERGENCY RESET
            git fetch --all
            git reset --hard origin/main
            git clean -fd
            
            # APP DEBUG INJECTION
            sed -i "s/APP_DEBUG=false/APP_DEBUG=true/g" .env || echo "No .env found or sed failed"
            
            # PATH AUDIT
            echo "NGINX ROOT SEARCH:" > public/path_reveal.txt
            grep -r "root" /etc/nginx/sites-enabled/ >> public/path_reveal.txt 2>&1 || echo "Cant read nginx conf" >> public/path_reveal.txt
            echo "CURRENT DIR: $(pwd)" >> public/path_reveal.txt
            echo "FILES IN PUBLIC:" >> public/path_reveal.txt
            ls -la public/ >> public/path_reveal.txt


            # Install dependencies (production)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # 1. FORCE DEBUG MODE
            sed -i "s/APP_DEBUG=false/APP_DEBUG=true/g" .env || echo "No .env"
            
            # 2. FIX PERMISSIONS
            chmod -R 775 storage bootstrap/cache
            
            # 3. MIGRATIONS
            php artisan migrate --force
            
            # 4. CACHE CLEAR
            php artisan config:clear
            php artisan cache:clear
            
            # 5. DUMP LAST ERROR TO PUBLIC
            tail -n 20 storage/logs/laravel.log > public/api_crash.txt
            chmod 644 public/api_crash.txt

            bash testing/remote_forensic_audit.sh > public/audit_reveal.txt 2>&1

            echo "--- MASTER REPAIR START ---"
            composer install --no-dev --optimize-autoloader || echo "Composer failed"
            php artisan migrate --force || echo "Migration failed"
            chmod -R 775 storage bootstrap/cache
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            echo "--- NGINX FORENSICS ---"
            grep -r "root" /etc/nginx/sites-enabled/
            grep -r "server_name" /etc/nginx/sites-enabled/
            echo "--- MASTER REPAIR END ---"

            bash testing/vps_emergency_fix.sh > public/reveal.txt 2>&1
            # RUN REMOTE AUDIT
            bash testing/remote_infra_audit.sh > public/audit_reveal.txt 2>&1
            echo "✅ Audit log created at public/audit_reveal.txt"

            [ -f storage/logs/laravel.log ] && tail -n 100 storage/logs/laravel.log > public/error_dump.txt || echo "No logs found" > public/error_dump.txt

            # Restart queue workers if running
            php artisan queue:restart 2>/dev/null || true

            # Set correct permissions
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "✅ Deploy completed successfully!"
