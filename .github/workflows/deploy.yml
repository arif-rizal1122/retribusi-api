# Timestamp: 2026-04-13 22:30
name: Deploy Production VPS (Folder Discovery)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy & Hard Repair Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH (Atomic Repair)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "--- STARTING ATOMIC REPAIR & DEPLOYMENT ---"
            cd /home/sipanda/retribusi-api

            # 1. FORCE CLEAN GIT STATE
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 2. ENVIRONMENT RECOVERY
            [ ! -f .env ] && cp .env.example .env && echo "Restored .env from example"

            # 3. DEPENDENCIES & MIGRATIONS
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force

            # 4. CACHE OPTIMIZATION
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            # 5. PERMISSIONS
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # 6. NGINX PARTITIONED RESTORATION
            if [ -f testing/vps_master_nginx_reset.sh ]; then
              echo "Applying Partitioned Nginx Configuration..."
              chmod +x testing/vps_master_nginx_reset.sh
              sudo ./testing/vps_master_nginx_reset.sh
            else
              echo "CRITICAL: Nginx reset script missing!"
              exit 1
            fi

            echo "--- FINAL HEALTH CHECK & VERIFICATION ---"
            # Verify API
            echo "API (api.sipanda.online):"
            curl -k -I https://api.sipanda.online/
            
            # Verify Admin
            echo "Admin (adminmpad.baubaukota.go.id):"
            curl -k -I https://adminmpad.baubaukota.go.id/
            
            # Verify Petugas
            echo "Petugas (petugasmpad.baubaukota.go.id):"
            curl -k -I https://petugasmpad.baubaukota.go.id/
            
            # Anti-Landing Page Check
            PAGE_SIZE=$(curl -k -s -o /dev/null -w "%{size_download}" https://adminmpad.baubaukota.go.id/)
            echo "Admin Page Size: $PAGE_SIZE"
            if [ "$PAGE_SIZE" == "7596" ]; then
              echo "CRITICAL: 'Soft Launching' landing page still detected!"
              exit 1
            fi

            echo "✅ ATOMIC REPAIR & PARTITIONING COMPLETED"
