name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/sipanda/retribusi-api

            # Pull latest code
            git pull origin main

            # Install dependencies (production)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            bash testing/vps_emergency_fix.sh > public/reveal.txt 2>&1
            # RUN REMOTE AUDIT
            bash testing/remote_infra_audit.sh > public/audit_reveal.txt 2>&1
            echo "✅ Audit log created at public/audit_reveal.txt"

            [ -f storage/logs/laravel.log ] && tail -n 100 storage/logs/laravel.log > public/error_dump.txt || echo "No logs found" > public/error_dump.txt

            # Restart queue workers if running
            php artisan queue:restart 2>/dev/null || true

            # Set correct permissions
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "✅ Deploy completed successfully!"
